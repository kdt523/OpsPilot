image:
  repository: ghcr.io/kdt523/opspilot-demo-shop
  tag: v1
  # IfNotPresent: local k3d uses imported images; a non-existent tag still fails to pull
  # (ImagePullBackOff), which the bad-image-tag scenario relies on.
  pullPolicy: IfNotPresent

# NOTE: FAIL_RATE is deliberately NOT set here; the v2-bug image bakes in FAIL_RATE=0.3.
gateway:
  replicas: 1
  cpuWorkMs: "15"
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }
orders:
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }
inventory:
  replicas: 1
  memoryBallastMb: "80"
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }
postgres:
  image: postgres:16-alpine
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }
redis:
  image: redis:7-alpine
  resources:
    requests: { cpu: 20m, memory: 16Mi }
    limits: { cpu: 200m, memory: 64Mi }
loadgen:
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { cpu: 200m, memory: 64Mi }
serviceMonitor:
  enabled: true
