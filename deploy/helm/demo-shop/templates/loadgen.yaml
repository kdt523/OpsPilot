apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-gen
  labels: { app: load-gen }
spec:
  replicas: 1
  selector:
    matchLabels: { app: load-gen }
  template:
    metadata:
      labels: { app: load-gen }
    spec:
      {{- include "shop.podSecurity" . | nindent 6 }}
      containers:
        - name: load-gen
          image: {{ .Values.image.repository }}:v1
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [python, -m, loadgen.loadgen]
          env: [{ name: TARGET_URL, value: "http://gateway:8000/checkout" }]
          # No HTTP server: exec probes confirm the interpreter is alive.
          livenessProbe: { exec: { command: [python, -c, "print(1)"] }, periodSeconds: 30 }
          readinessProbe: { exec: { command: [python, -c, "print(1)"] }, periodSeconds: 30 }
          resources: {{- toYaml .Values.loadgen.resources | nindent 12 }}
          {{- include "shop.containerSecurity" . | nindent 10 }}
