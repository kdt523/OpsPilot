{{- range $role := list "gateway" "orders" "inventory" }}
{{- $v := index $.Values $role }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $role }}
  labels: { app: {{ $role }}, part-of: demo-shop }
spec:
  replicas: {{ $v.replicas }}
  revisionHistoryLimit: 10
  selector:
    matchLabels: { app: {{ $role }} }
  template:
    metadata:
      labels: { app: {{ $role }}, part-of: demo-shop }
    spec:
      {{- include "shop.podSecurity" $ | nindent 6 }}
      containers:
        - name: shop
          image: {{ $.Values.image.repository }}:{{ $.Values.image.tag }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports: [{ name: http, containerPort: 8000 }]
          env:
            - { name: ROLE, value: {{ $role | quote }} }
            {{- if eq $role "gateway" }}
            - { name: ORDERS_URL, value: "http://orders:8000" }
            - { name: INVENTORY_URL, value: "http://inventory:8000" }
            - { name: CPU_WORK_MS, value: {{ $v.cpuWorkMs | quote }} }
            {{- else if eq $role "orders" }}
            # Demo Postgres uses trust auth, so this URL carries no credentials.
            - { name: DATABASE_URL, value: "postgresql://demo@postgres-demo:5432/demo" }
            {{- else }}
            - { name: REDIS_URL, value: "redis://redis-demo:6379/0" }
            - { name: MEMORY_BALLAST_MB, value: {{ $v.memoryBallastMb | quote }} }
            {{- end }}
          {{- include "shop.probes" $ | nindent 10 }}
          resources: {{- toYaml $v.resources | nindent 12 }}
          {{- include "shop.containerSecurity" $ | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $role }}
  labels: { app: {{ $role }}, part-of: demo-shop }
spec:
  selector: { app: {{ $role }} }
  ports: [{ name: http, port: 8000, targetPort: http }]
{{- end }}
