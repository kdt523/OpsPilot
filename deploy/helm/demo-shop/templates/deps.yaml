apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-demo
  labels: { app: postgres-demo }
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres-demo }
  template:
    metadata:
      labels: { app: postgres-demo }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 70, runAsGroup: 70, fsGroup: 70, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports: [{ containerPort: 5432 }]
          env:
            - { name: POSTGRES_DB, value: demo }
            - { name: POSTGRES_USER, value: demo }
            - { name: POSTGRES_HOST_AUTH_METHOD, value: trust }
            - { name: PGDATA, value: /tmp/pgdata }
          readinessProbe: { exec: { command: [pg_isready, -U, demo] }, periodSeconds: 5 }
          livenessProbe: { exec: { command: [pg_isready, -U, demo] }, initialDelaySeconds: 20, periodSeconds: 10 }
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: run, mountPath: /var/run/postgresql }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: run, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-demo
spec:
  selector: { app: postgres-demo }
  ports: [{ port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-demo
  labels: { app: redis-demo }
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis-demo }
  template:
    metadata:
      labels: { app: redis-demo }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          args: [--save, "", --appendonly, "no"]
          ports: [{ containerPort: 6379 }]
          readinessProbe: { tcpSocket: { port: 6379 }, periodSeconds: 5 }
          livenessProbe: { tcpSocket: { port: 6379 }, initialDelaySeconds: 5, periodSeconds: 10 }
          resources: {{- toYaml .Values.redis.resources | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: data, mountPath: /data }]
      volumes: [{ name: data, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata:
  name: redis-demo
spec:
  selector: { app: redis-demo }
  ports: [{ port: 6379, targetPort: 6379 }]
