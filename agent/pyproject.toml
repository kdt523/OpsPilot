[project]
name = "opspilot-agent"
version = "0.1.0"
description = "OpsPilot: AI incident-response agent for Kubernetes"
requires-python = ">=3.12"
dependencies = [
  "fastapi", "uvicorn[standard]", "pydantic-settings", "sqlalchemy[asyncio]", "asyncpg", "alembic",
  "redis", "httpx", "kubernetes", "google-genai", "fastembed", "pgvector", "prometheus-client",
  "structlog", "tenacity", "slack-bolt", "slack-sdk", "pyyaml", "jsonschema",
]

[project.optional-dependencies]
langfuse = ["langfuse"]

[dependency-groups]
dev = [
  "pytest", "pytest-asyncio", "pytest-cov", "testcontainers", "respx", "ruff", "mypy",
  "types-PyYAML", "types-jsonschema",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: needs Docker (testcontainers)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]
plugins = []
