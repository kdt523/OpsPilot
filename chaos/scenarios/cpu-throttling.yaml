id: cpu-throttling
title: CPU limit too low on gateway (latency)
expected_category: resource_throttling
expected_fix: [rollout_undo]
fix_optional: true
target: { namespace: demo, deployment: gateway }
inject:
  - ["set", "resources", "deployment/gateway", "--limits=cpu=50m", "-n", "demo"]
wait_for_alert: { alertname: HighLatencyP99, timeout_s: 420 }
