id: missing-config
title: Required env var DATABASE_URL removed
expected_category: crashloop_config
expected_fix: [rollout_undo]
target: { namespace: demo, deployment: orders }
inject:
  - ["set", "env", "deployment/orders", "DATABASE_URL-", "-n", "demo"]
wait_for_alert: { alertname: PodNotHealthy, timeout_s: 300 }
